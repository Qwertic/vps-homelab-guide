services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__server__ROOT_URL: https://git.${DOMAIN}/
      FORGEJO__server__SSH_DOMAIN: git.${DOMAIN}
      FORGEJO__server__SSH_PORT: 2222
      FORGEJO__database__DB_TYPE: sqlite3
      # The first-run install page still lets you create the admin account.
      FORGEJO__service__DISABLE_REGISTRATION: "true"
    ports:
      - "${TS_IP}:2222:22"   # git over SSH: ssh://git@git.<DOMAIN>:2222/...
    volumes:
      - /srv/state/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    networks: [proxy]

networks:
  proxy:
    external: true
