services:
  vaultwarden:
    image: vaultwarden/server:1.37.4
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.${DOMAIN}
      # true only while you create your own account, then set false and re-up.
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-false}
    volumes:
      - /srv/state/vaultwarden:/data
    networks: [proxy]

networks:
  proxy:
    external: true
