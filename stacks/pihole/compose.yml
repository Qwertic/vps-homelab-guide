services:
  pihole:
    image: pihole/pihole:2026.09.0
    restart: unless-stopped
    ports:
      # DNS for your tailnet only. A public port 53 is an open resolver that gets abused.
      - "${TS_IP}:53:53/tcp"
      - "${TS_IP}:53:53/udp"
    environment:
      TZ: ${TZ:-Etc/UTC}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: all
      # Unbound below resolves from the root servers itself, so no single upstream
      # company sees every lookup. It also does the DNSSEC validation.
      FTLCONF_dns_upstreams: "10.53.0.2#53"
      # Lab names (*.DOMAIN) answer locally, even when Cloudflare's DNS is down.
      FTLCONF_misc_dnsmasq_lines: "address=/${DOMAIN}/${TS_IP}"
      # The host already keeps time; skip Pi-hole's NTP sync (it lacks CAP_SYS_TIME anyway).
      FTLCONF_ntp_sync_active: "false"
    volumes:
      - /srv/state/pihole:/etc/pihole
    depends_on: [unbound]
    networks:
      proxy: {}
      dns: {}

  unbound:
    image: klutchell/unbound:v1.26.1
    restart: unless-stopped
    networks:
      dns:
        # Fixed address because Pi-hole's upstream has to be an IP. 10.53.0.0/29 sits
        # outside Docker's default address pools, so it can't collide with other stacks.
        ipv4_address: 10.53.0.2

networks:
  proxy:
    external: true
  dns:
    ipam:
      config:
        - subnet: 10.53.0.0/29
